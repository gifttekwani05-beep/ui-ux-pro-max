<!-- Hero Section Template -->
<!-- Use this as a reference for creating hero sections -->

<section class="hero" id="hero-template">
    <div class="hero-content">
        <h1 class="hero-title" data-aos="fade-up">
            Your Compelling Headline
        </h1>
        <p class="hero-subtitle" data-aos="fade-up" data-aos-delay="200">
            Your supporting subtitle or tagline
        </p>
        <button class="cta-button" data-aos="fade-up" data-aos-delay="400">
            Call to Action
        </button>
    </div>
    <div class="hero-animation">
        <!-- Add decorative animated elements here -->
        <div class="animated-sphere"></div>
        <div class="floating-shape shape-1"></div>
    </div>
</section>

<!-- Customization Guide -->
<!-- 
1. Replace "Your Compelling Headline" with your actual headline
2. Update the hero-subtitle text
3. Change button text to match your CTA
4. Customize the animated elements in hero-animation div
5. Adjust colors using CSS variables:
   --primary-color
   --secondary-color
   --accent-color

Animation Options:
- data-aos="fade-up"
- data-aos="fade-down"
- data-aos="fade-left"
- data-aos="fade-right"
- data-aos="zoom-in"

Delay Options:
- data-aos-delay="0"   (instant)
- data-aos-delay="200" (200ms)
- data-aos-delay="400" (400ms)
-->
